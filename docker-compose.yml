version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agentshield-backend
    ports:
      - "8000:8000"
    environment:
      - AGENTSHIELD_ENV=production
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - AGENTSHIELD_DB_PATH=/app/data/agentshield.db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - agentshield_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agentshield-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_PORT=8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  agentshield_data:
